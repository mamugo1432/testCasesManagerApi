spring.application.name=manager
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.url=jdbc:mysql://localhost:3306/testcase_manager?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=none
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT
app.jwt.secret=${JWT_SECRET:dev-secret-change-me-0123456789-0123456789-0123456789}
app.jwt.expiration=24h